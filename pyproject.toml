[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-dataset-benchmarks"
version = "1.1.0"
description = "Continuum AI multi-organization synthetic datasets and reproducible SAG RAG benchmark suite."
requires-python = ">=3.12,<3.14"
dependencies = [
    "asyncpg>=0.29.0,<1.0",
    "boto3>=1.35.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "openpyxl>=3.1.5,<4.0",
    "pyarrow>=17.0.0,<20.0",
    "pydantic>=2.9.0,<3.0",
    "python-docx>=1.1.2,<2.0",
    "PyYAML>=6.0.2,<7.0",
    "SQLAlchemy>=2.0.35,<3.0",
    "starlette>=0.40.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0,<1.0",
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.7.0,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
testpaths = [".", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
